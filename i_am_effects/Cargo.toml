[package]
name = "i_am_effects"
version = "0.1.0"
edition = "2024"
description = "The small effects, as plug-ins: one library, many plug-ins"

[features]
# Adds the VST3 entry points to the exported library (through i_am_plugin).
vst3 = ["i_am_plugin/vst3"]
# The standalone demo host, for running an effect in a window with a test source in
# front of it: cargo run -p i_am_effects --example effects_demo --features standalone
standalone = ["i_am_dsp_iced/standalone"]

[lib]
# A plug-in library, and an rlib so the tests and examples in this crate can link it.
crate-type = ["cdylib", "rlib"]

# Read by "cargo bundle" (the i_am_bundler tool) when naming the .vst3 / .clap bundle.
[package.metadata.i_am_dsp]
name = "I Am Effects"
vendor = "iamplugins"
id = "iamdsp.effects"

[dependencies]
i_am_dsp = { workspace = true }
i_am_dsp_iced = { workspace = true }
i_am_plugin = { workspace = true }
