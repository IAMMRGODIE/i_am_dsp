[package]
name = "i_am_effects"
version = "0.1.0"
edition = "2024"

# The web-faceplate effects: DSP, the parameter plumbing and one `web_plugin!`
# registration per product. The entry points live in `i_am_effects_bundle`, so
# this crate is a plain library that another plug-in (the rack) can link without
# dragging in a second `clap_entry`.
[lib]
# A library only: no `clap_entry`, so it can be linked into a plug-in.
crate-type = ["rlib"]

[features]
default = []
# Ramps the parameters a product names in its `smoothed = ...` list between blocks
# instead of stepping them. Off by default: it trades a short parameter delay for the
# absence of steps, and only some parameters want that.
smoothing = ["i_am_plugin/smoothing"]

[dependencies]
i_am_dsp = { workspace = true }
i_am_dsp_derive = { workspace = true }
i_am_plugin = { workspace = true }
i_am_web_gui = { workspace = true }
crossbeam-channel = "0.5.16"
rhai = { version = "1.25.1", features = ["f32_float", "sync", "only_i32"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"

# The Convolver opens its own file dialog, owned by the window the user clicked,
# so the picker cannot end up behind the DAW (or look like it never opened).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
rfd = "0.17.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true