[package]
name = "i_am_plugin"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Exports the VST3 entry points (GetPluginFactory, InitDll, ...) from the plug-in
# library by linking clap-wrapper and the VST3 SDK into it.
# Off by default: turning it on needs a C++ toolchain and a longer first build.
vst3 = ["dep:clap-wrapper", "clap-wrapper/vst3", "clap-wrapper/parallel"]
# Ramps a parameter over a few blocks instead of handing the DSP a jump. A VST3 host
# behind clap-wrapper delivers one value per block, so an automation ramp reaches the
# plug-in as a staircase and every step is a small click; smoothing turns the steps
# back into a line at the cost of a short delay on that parameter. Only the parameters
# a plug-in names in `Plugin::SMOOTHED_PARAMETERS` are touched.
smoothing = []

[dependencies]
clack-extensions = { version = "0.1.1", features = [
	"gui", "clack-plugin", "raw-window-handle_06", "audio-ports",
	"state", "params", "clap-wrapper", "latency", "note-ports", "timer"
] }
clack-plugin = "0.1.1"
# The raw CLAP C API: the host side of the latency extension is not wrapped for plugins
# yet, so telling a host that the latency changed goes through it directly.
clap-sys = "0.5.0"
i_am_dsp = { workspace = true }
# The parent window a host hands us is copied as a raw handle; that is the whole of
# what this crate knows about a windowing system.
raw-window-handle = "0.6.0"
crossbeam-channel = "0.5.16"
xxhash-rust = { version = "0.8.18", features = ["const_xxh3"] }
clap-wrapper = { version = "0.3.1", optional = true, default-features = false }

[dev-dependencies]
# A CLAP host, for the probe that loads a built library and asks it what it has.
clack-host = "0.1.1"
# The smoothing tests need a real parameter table, and the table is what the derive
# macro builds.
i_am_dsp_derive = { workspace = true }

# The WebView2 editor backend (formerly the i_am_plugin_wry crate). It lives
# here so a plug-in crate only depends on one plugin package. The non-Windows
# build keeps a stub with the same API.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57.2", default-features = false }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_System_LibraryLoader",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_UI_HiDpi",
	"Win32_UI_WindowsAndMessaging",
] }

# Linux embeds a WebKitGTK view in the host's X11 window. wry does the view,
# but the GTK side of the deal is the caller's: this crate has to initialise GTK
# on the GUI thread and advance its loop from the host's timer, so gtk is a
# direct dependency here rather than an implementation detail of wry.
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57.2", default-features = false, features = [
	"os-webview",
	"x11",
] }
gtk = "0.18"
# Measuring the host's window: the same X11 client library wry already loads.
x11-dl = "2.21"

# macOS embeds a WKWebView as a subview of the host's NSView; no toolkit of our
# own is involved, so the plain builder is all this needs.
[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57.2", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true