[package]
name = "i_am_effects_web"
version = "0.1.0"
edition = "2024"

# The first web-faceplate products: the same DSP and metadata as the iced bundle,
# with a page instead of a widget tree.
#
# The .web suffix keeps these apart from the released plug-in ids, so a host can
# hold both while the web front end is being tried out.
[lib]
# A plug-in library, and an rlib so the tests and examples here can link it.
crate-type = ["cdylib", "rlib"]

# Read by "cargo bundle" (the i_am_bundler tool) when naming the .clap bundle.
[package.metadata.i_am_dsp]
name = "I Am Effects Web"
vendor = "iamplugins"
id = "iamdsp.effects.web"

[dependencies]
i_am_dsp = { workspace = true }
i_am_dsp_derive = { workspace = true }
i_am_plugin = { workspace = true }
i_am_web_gui = { workspace = true }
i_am_effects_core = { workspace = true }
crossbeam-channel = "0.5.16"
rhai = { version = "1.25.1", features = ["f32_float", "sync", "only_i32"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }

# The Convolver opens its own file dialog, owned by the window the user clicked,
# so the picker cannot end up behind the DAW (or look like it never opened).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
rfd = "0.17.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
