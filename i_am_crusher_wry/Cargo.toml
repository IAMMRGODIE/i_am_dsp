[package]
name = "i_am_crusher_wry"
version = "0.1.0"
edition = "2024"
description = "I Am Crusher with a WebView2 editor (experimental)"

[features]
# Adds the VST3 entry points to the exported library (through i_am_plugin).
vst3 = ["i_am_plugin/vst3"]

[lib]
# A plug-in library, and an rlib so the tests and examples here can link it.
crate-type = ["cdylib", "rlib"]

# Read by "cargo bundle" (the i_am_bundler tool) when naming the .vst3 / .clap bundle.
[package.metadata.i_am_dsp]
name = "I Am Crusher Web"
vendor = "iamplugins"
id = "iamdsp.effects.crusher.web"

[dependencies]
i_am_dsp = { workspace = true }
# The GUI-neutral half of the effects bundle: the processor wrapper and its
# message, without the iced dependency or a plug-in export of its own.
i_am_effects_core = { workspace = true }
i_am_plugin = { workspace = true }
i_am_plugin_wry = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# The demo creates the host's parent window by hand, standing in for a DAW.
crossbeam-channel = "0.5.16"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_WindowsAndMessaging",
] }