<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Am Crusher</title>
<style>
  :root {
    --bg: #07070a;
    --panel: #0e0e14;
    --line: #242430;
    --line-soft: #191922;
    --text: #ece9e2;
    --dim: #8b8794;
    --faint: #56525f;
    --acid: #d7ff3f;
    --violet: #8b7cff;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(120% 90% at 50% -20%, #191923 0%, var(--bg) 58%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .35;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }

  .stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 400px;
    height: 640px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
  }

  .app {
    position: relative;
    height: 100%;
    padding: 12px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex: none;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: .44em;
    text-transform: uppercase;
    color: var(--dim);
  }

  h1 {
    margin: 3px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 31px;
    font-weight: 600;
    line-height: .95;
    letter-spacing: .015em;
  }

  h1 em { font-style: normal; color: var(--acid); }

  .meta {
    text-align: right;
    font-size: 8px;
    line-height: 1.65;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .scope {
    position: relative;
    height: 112px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: radial-gradient(130% 150% at 50% 0%, #15151f 0%, #0a0a0f 74%);
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,.55);
  }

  canvas { display: block; width: 100%; height: 100%; }

  .scope .tag,
  .scope .readout {
    position: absolute;
    font-size: 8px;
    letter-spacing: .24em;
    text-transform: uppercase;
    pointer-events: none;
  }

  .scope .tag { top: 9px; left: 12px; color: var(--faint); }
  .scope .readout { right: 12px; bottom: 8px; color: var(--dim); letter-spacing: .12em; }

  .sections {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }

  .section { border-top: 1px solid var(--line-soft); padding-top: 6px; }

  .section-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 3px;
  }

  .section-head span {
    font-size: 8px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .section-head i {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 12px;
  }

  .knob {
    --size: 72px;
    width: var(--size);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: ns-resize;
    touch-action: none;
  }

  .knob.big { --size: 92px; }
  .knob.small { --size: 60px; }

  .knob svg {
    width: var(--size);
    height: var(--size);
    display: block;
    overflow: visible;
  }

  .knob .name {
    font-size: 8px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
  }

  .knob .value {
    font-size: 11px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .knob.big .value { font-size: 14px; }

  .knob .track { fill: none; stroke: #23232d; stroke-width: 5; stroke-linecap: round; }
  .knob .fill { fill: none; stroke: var(--acid); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(215,255,63,.35)); }
  .knob .cap { fill: #14141b; stroke: #2b2b37; stroke-width: 1; }
  .knob .pointer { stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; }
  .knob.big .pointer { stroke: var(--acid); }
  .knob .hub { fill: var(--text); opacity: .85; }
  .knob.active .cap { stroke: var(--acid); }
  .knob.active .name { color: var(--text); }

  .gain-row { display: flex; align-items: center; justify-content: space-around; gap: 16px; }

  footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 8px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  footer .link { display: inline-flex; align-items: center; gap: 6px; }

  footer .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--acid);
    box-shadow: 0 0 7px var(--acid);
  }

  footer .dot.waiting { background: var(--violet); box-shadow: 0 0 7px var(--violet); }

  @media (max-height: 560px) {
    .scope { height: 96px; }
    .knob.big { --size: 78px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="app">
  <header>
    <div>
      <div class="eyebrow">I Am Plugins</div>
      <h1>I AM <em>CRUSHER</em></h1>
    </div>
    <div class="meta">Dispersion<br>Saturation<br>Amplitude</div>
  </header>

  <div class="scope">
    <canvas id="scope"></canvas>
    <div class="tag">Dispersion field</div>
    <div class="readout" id="readout">AMOUNT 0 %</div>
  </div>

  <div class="sections">
    <section class="section">
      <div class="section-head"><span>Drive</span><i></i></div>
      <div class="row">
        <div class="knob big" data-id="amount" data-name="Amount"></div>
        <div class="knob" data-id="frequency" data-name="LFO Freq"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><span>Amplitude</span><i></i></div>
      <div class="row">
        <div class="knob" data-id="am_amount" data-name="AM Amount"></div>
        <div class="knob" data-id="am_frequency" data-name="AM Freq"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><span>Gain</span><i></i></div>
      <div class="gain-row">
        <div class="knob small" data-id="input_gain.gain" data-name="Input"></div>
        <div class="knob small" data-id="output_gain.gain" data-name="Output"></div>
      </div>
    </section>
  </div>

  <footer>
    <span class="link"><i class="dot" id="dot"></i><span id="status">LINKING</span></span>
    <span>drag &middot; shift = fine &middot; dbl-click = reset</span>
  </footer>
</div>
</div>

<script>
  "use strict";

  var PARAMS = __PARAMS__;
  var ARC = 2 * Math.PI * 42;
  var SWEEP = 0.75;

  var specs = {};
  var values = {};
  var knobs = {};
  var dragId = null;
  var dragLastY = 0;
  var dragLastNorm = 0;

  function clamp01(value) {
    return Math.max(0, Math.min(1, value));
  }

  function normalize(id, value) {
    var spec = specs[id];
    if (spec.log) {
      return Math.log(value / spec.min) / Math.log(spec.max / spec.min);
    }
    return (value - spec.min) / (spec.max - spec.min);
  }

  function denormalize(id, norm) {
    var spec = specs[id];
    var t = clamp01(norm);
    if (spec.log) {
      return spec.min * Math.pow(spec.max / spec.min, t);
    }
    return spec.min + (spec.max - spec.min) * t;
  }

  function formatValue(id, value) {
    var spec = specs[id];
    if (spec.unit === "percent") {
      return (value * 100).toFixed(value < 0.1 ? 1 : 0) + " %";
    }
    if (spec.unit === "hz") {
      return value >= 1000 ? (value / 1000).toFixed(2) + " kHz" : Math.round(value) + " Hz";
    }
    var decibels = 20 * Math.log(Math.max(value, 0.0001)) / Math.LN10;
    return decibels.toFixed(1) + " dB";
  }

  function setStatus(text, waiting) {
    document.getElementById("status").textContent = text;
    var dot = document.getElementById("dot");
    if (waiting) dot.classList.add("waiting"); else dot.classList.remove("waiting");
  }

  function updateReadout() {
    var amount = values["amount"] || 0;
    var lfo = values["frequency"] || 0;
    var lfoText = lfo >= 1000 ? (lfo / 1000).toFixed(2) + " kHz" : Math.round(lfo) + " Hz";
    document.getElementById("readout").textContent =
      "AMOUNT " + Math.round(amount * 100) + " %  \u00b7  LFO " + lfoText;
  }

  function buildKnob(element) {
    var id = element.dataset.id;
    var dash = (ARC * SWEEP).toFixed(2) + " " + ARC.toFixed(2);

    element.innerHTML =
      '<svg viewBox="0 0 100 100" aria-hidden="true">' +
        '<g transform="rotate(135 50 50)">' +
          '<circle class="track" cx="50" cy="50" r="42" stroke-dasharray="' + dash + '"></circle>' +
          '<circle class="fill" cx="50" cy="50" r="42" stroke-dasharray="0 ' + ARC.toFixed(2) + '"></circle>' +
        '</g>' +
        '<circle class="cap" cx="50" cy="50" r="29"></circle>' +
        '<g class="needle"><line class="pointer" x1="50" y1="50" x2="50" y2="24"></line></g>' +
        '<circle class="hub" cx="50" cy="50" r="3.2"></circle>' +
      '</svg>' +
      '<div class="name">' + element.dataset.name + '</div>' +
      '<div class="value">--</div>';

    knobs[id] = {
      fill: element.querySelector(".fill"),
      needle: element.querySelector(".needle"),
      value: element.querySelector(".value")
    };
  }

  function applyValue(id, value, send) {
    var spec = specs[id];
    if (!spec) return;

    value = Math.max(spec.min, Math.min(spec.max, value));
    values[id] = value;

    var knob = knobs[id];
    if (knob) {
      var norm = clamp01(normalize(id, value));
      knob.fill.setAttribute("stroke-dasharray", (ARC * SWEEP * norm).toFixed(2) + " " + ARC.toFixed(2));
      knob.needle.setAttribute("transform", "rotate(" + (-135 + 270 * norm).toFixed(2) + " 50 50)");
      knob.value.textContent = formatValue(id, value);
    }

    updateReadout();

    if (send && window.ipc && window.ipc.postMessage) {
      window.ipc.postMessage(id + "=" + value.toFixed(6));
    }
  }

  function bindKnob(element) {
    var id = element.dataset.id;

    element.addEventListener("pointerdown", function (event) {
      if (!specs[id]) return;
      dragId = id;
      dragLastY = event.clientY;
      dragLastNorm = clamp01(normalize(id, values[id]));
      element.setPointerCapture(event.pointerId);
      element.classList.add("active");
      event.preventDefault();
    });

    element.addEventListener("pointermove", function (event) {
      if (dragId !== id) return;
      var dy = dragLastY - event.clientY;
      dragLastY = event.clientY;
      dragLastNorm = clamp01(dragLastNorm + dy * (event.shiftKey ? 0.0012 : 0.0055));
      applyValue(id, denormalize(id, dragLastNorm), true);
    });

    function endDrag() {
      if (dragId === id) {
        dragId = null;
        element.classList.remove("active");
      }
    }

    element.addEventListener("pointerup", endDrag);
    element.addEventListener("pointercancel", endDrag);
    element.addEventListener("lostpointercapture", endDrag);

    element.addEventListener("dblclick", function () {
      applyValue(id, specs[id].default, true);
    });
  }

  function poll() {
    fetch("/state", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("state");
        return response.json();
      })
      .then(function (state) {
        for (var id in state) {
          if (dragId !== id) applyValue(id, state[id], false);
        }
        setStatus("LINKED", false);
        window.setTimeout(poll, 80);
      })
      .catch(function () {
        setStatus("WAITING", true);
        window.setTimeout(poll, 500);
      });
  }

  var canvas = document.getElementById("scope");
  var context = canvas.getContext("2d");

  // The whole faceplate is a fixed 400x640 stage; a resized window scales it as one
  // piece (letterboxing if the host ignores the aspect ratio) instead of reflowing
  // the controls out of the design grid.
  var DESIGN_WIDTH = 400;
  var DESIGN_HEIGHT = 640;
  var stageScale = 1;

  function fitStage() {
    var scale = Math.min(window.innerWidth / DESIGN_WIDTH, window.innerHeight / DESIGN_HEIGHT);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    stageScale = scale;

    var stage = document.getElementById("stage");
    if (stage) stage.style.transform = "translate(-50%, -50%) scale(" + scale + ")";

    resizeCanvas();
  }

  function resizeCanvas() {
    var width = canvas.clientWidth;
    var height = canvas.clientHeight;
    var ratio = (window.devicePixelRatio || 1) * stageScale;
    canvas.width = Math.max(1, Math.round(width * ratio));
    canvas.height = Math.max(1, Math.round(height * ratio));
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  window.addEventListener("resize", fitStage);

  function draw(timestamp) {
    var width = canvas.clientWidth;
    var height = canvas.clientHeight;
    if (width < 2 || height < 2) { window.requestAnimationFrame(draw); return; }

    context.clearRect(0, 0, width, height);

    var stepX = 28;
    var stepY = 20;
    context.strokeStyle = "rgba(236,233,226,0.055)";
    context.lineWidth = 1;
    for (var gx = stepX; gx < width; gx += stepX) {
      context.beginPath();
      context.moveTo(gx + 0.5, 0);
      context.lineTo(gx + 0.5, height);
      context.stroke();
    }
    for (var gy = stepY; gy < height; gy += stepY) {
      context.beginPath();
      context.moveTo(0, gy + 0.5);
      context.lineTo(width, gy + 0.5);
      context.stroke();
    }

    var middle = height * 0.52;
    context.strokeStyle = "rgba(236,233,226,0.16)";
    context.beginPath();
    context.moveTo(0, middle + 0.5);
    context.lineTo(width, middle + 0.5);
    context.stroke();

    var amount = values["amount"] || 0;
    var am = values["am_amount"] || 0;
    var lfo = values["frequency"] || 299;
    var amlfo = values["am_frequency"] || 486;
    var time = timestamp * 0.001;
    var phase = time * (0.25 + (lfo / 2000) * 1.35) * Math.PI * 2;
    var amPhase = time * (0.2 + (amlfo / 2000) * 1.6) * Math.PI * 2;

    var points = [];
    var count = Math.max(2, Math.round(width));
    for (var i = 0; i <= count; i++) {
      var u = i / count;
      var base = Math.sin(u * Math.PI * 6 + phase);
      var warp = Math.sin(base * Math.PI * 1.5 + u * Math.PI * 4 + phase * 0.35) * amount * 0.85;
      var envelope = (1 - am) + am * Math.sin(amPhase + u * Math.PI * 3);
      var value = (base + warp) * (1 - amount * 0.25) * envelope;
      points.push([u * width, middle - value * height * 0.32]);
    }

    var gradient = context.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, "rgba(215,255,63,0.16)");
    gradient.addColorStop(1, "rgba(215,255,63,0)");
    context.beginPath();
    context.moveTo(0, middle);
    for (var f = 0; f < points.length; f++) context.lineTo(points[f][0], points[f][1]);
    context.lineTo(width, middle);
    context.closePath();
    context.fillStyle = gradient;
    context.fill();

    context.beginPath();
    for (var s = 0; s < points.length; s++) {
      if (s === 0) context.moveTo(points[s][0], points[s][1]);
      else context.lineTo(points[s][0], points[s][1]);
    }
    context.strokeStyle = "#d7ff3f";
    context.lineWidth = 1.6;
    context.shadowBlur = 12;
    context.shadowColor = "rgba(215,255,63,0.5)";
    context.stroke();
    context.shadowBlur = 0;

    window.requestAnimationFrame(draw);
  }

  for (var p = 0; p < PARAMS.length; p++) {
    specs[PARAMS[p].id] = PARAMS[p];
  }

  var knobElements = document.querySelectorAll(".knob");
  for (var k = 0; k < knobElements.length; k++) {
    buildKnob(knobElements[k]);
    bindKnob(knobElements[k]);
  }

  for (var id in specs) {
    applyValue(id, specs[id].default, false);
  }

  fitStage();
  window.requestAnimationFrame(draw);
  poll();
</script>
</body>
</html>
