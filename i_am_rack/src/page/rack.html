<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>I Am Multipass</title>
<link rel="stylesheet" href="/kit.css?v=2">
<link rel="stylesheet" href="/card.css?v=2">
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="power" class="power" type="button" title="Bypass" aria-label="Bypass" aria-pressed="false">
      <span class="dot"></span>
    </button>
    <span class="title">I Am Multipass</span>
    <span class="tag">M5</span>
    <span class="spacer"></span>
    <button id="undo" class="bar-button" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>&#8630;</button>
    <button id="redo" class="bar-button" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>&#8631;</button>
    <span class="bar-sep"></span>
    <button id="ab" class="bar-button" type="button" title="A/B compare" aria-label="A/B compare" data-active="A">A</button>
    <span class="bar-sep"></span>
    <button id="preset-init" class="bar-button" type="button" title="Reset to the initial rack">Init</button>
    <button id="preset-save" class="bar-button" type="button" title="Save the rack as a JSON file">Save</button>
    <button id="preset-load" class="bar-button" type="button" title="Load a rack JSON file">Load</button>
    <input id="preset-file" type="file" accept=".json,application/json" hidden>
    <span id="rate" class="rate">--</span>
  </header>
  <main id="rack" class="rack" aria-live="polite"></main>
  <div id="splitter" class="splitter" role="separator" aria-label="Resize rack and control panel" tabindex="0"></div>
  <section id="bottom" class="bottom" aria-label="Control sources">
    <div class="panel-tabs">
      <button type="button" class="panel-tab on" data-panel="sources">SOURCES</button>
      <button type="button" class="panel-tab" data-panel="matrix">MATRIX</button>
      <button type="button" class="panel-tab" data-panel="daw">DAW PARAMETERS</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </section>
  <footer class="footer">
    <span id="status">loading</span>
    <span class="spacer"></span>
    <span class="hint">LR4 &#183; 3 bands + full &#183; dynamic slots &#183; mod matrix</span>
  </footer>
</div>
<script src="/card.js?v=2"></script>
<script src="/kit.js?v=2"></script>
</body>
</html>
