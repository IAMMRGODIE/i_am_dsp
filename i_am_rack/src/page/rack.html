<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>I Am Multipass</title>
<link rel="stylesheet" href="/kit.css?v=1">
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="power" class="power" type="button" title="Bypass" aria-label="Bypass" aria-pressed="false">
      <span class="dot"></span>
    </button>
    <span class="title">I Am Multipass</span>
    <span class="tag">M0</span>
    <span class="spacer"></span>
    <span id="rate" class="rate">--</span>
  </header>
  <main id="rack" class="rack" aria-live="polite"></main>
  <footer class="footer">
    <span id="status">loading</span>
    <span class="spacer"></span>
    <span class="hint">module parameters stay in the rack state, not in the host table</span>
  </footer>
</div>
<script src="/kit.js?v=1"></script>
</body>
</html>
