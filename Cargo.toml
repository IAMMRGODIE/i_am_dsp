i_am_plugin_iced = { path = "i_am_plugin_iced" }
i_am_plugin_wry = { path = "i_am_plugin_wry" }
i_am_crusher_wry = { path = "i_am_crusher_wry" }
i_am_effects = { path = "i_am_effects" }
i_am_effects_core = { path = "i_am_effects_core" }
i_am_web_gui = { path = "i_am_web_gui" }
i_am_effects_web = { path = "i_am_effects_web" }
