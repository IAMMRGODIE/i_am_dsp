[workspace]
resolver = "2"
members = [
	"i_am_dsp_derive",
	"i_am_string",
	"i_am_dsp",
	"i_am_plugin",
	"i_am_bundler",
	"i_am_effects",
	"i_am_effects_bundle",
	"i_am_web_gui",
	"i_am_rack",
	"i_am_patch",
	"i_am_patch_product",
	"i_am_patch_bundle",
	"i_am_synths",
	"i_am_synths_bundle",
]

[workspace.dependencies]
i_am_dsp_derive = { path = "i_am_dsp_derive" }
i_am_string = { path = "i_am_string" }
i_am_dsp = { path = "i_am_dsp" }
i_am_plugin = { path = "i_am_plugin" }
i_am_effects = { path = "i_am_effects" }
i_am_web_gui = { path = "i_am_web_gui" }
i_am_patch = { path = "i_am_patch" }
i_am_patch_product = { path = "i_am_patch_product" }
i_am_synths = { path = "i_am_synths" }

# wry registers a process-global WRY_WEBVIEW window class. A host that
# unloads a plug-in DLL while the process stays alive leaves that class with a
# dangling wndproc, and the next WebView crashes on its first window message.
# The vendored copy gives each WebView its own class and unregisters it on drop.
[patch.crates-io]
wry = { path = "vendor/wry" }

[workspace.lints.cargo]
unused_dependencies = "warn"