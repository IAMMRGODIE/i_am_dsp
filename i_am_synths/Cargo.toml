[package]
name = "i_am_synths"
version = "0.1.0"
edition = "2024"

# The synthesizer products: instruments, not effects. A product is the DSP, the
# parameter metadata and one line naming the window; the CLAP/VST3 entry points
# live in `i_am_synths_bundle`, so this crate stays a plain library.
[lib]
crate-type = ["rlib"]

[dependencies]
# The scripted additive voice needs the Rhai generator.
i_am_dsp = { workspace = true, features = ["rhai"] }
i_am_plugin = { workspace = true }
i_am_web_gui = { workspace = true }
# The drawn spectrum pages cross the editor route as JSON.
serde_json = "1"
