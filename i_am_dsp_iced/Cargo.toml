[package]
name = "i_am_dsp_iced"
version = "0.1.0"
edition = "2024"

[features]
default = ["standalone", "faceplate"]
standalone = ["cpal"]
# Lay an effect out from what its parameters say about themselves. It is the only
# part of this crate that needs the layout metadata, so it can be left out along
# with it.
faceplate = ["i_am_dsp/layout"]

[dependencies]
i_am_dsp.workspace = true

cfg-if = "1.0.4"
cpal = { version = "0.18.2", optional = true }
crossbeam-channel = "0.5.16"
iced = { version = "0.14.0", features = ["canvas", "tokio", "advanced"] }
lazy_static = "1.5.0"
portable-atomic = { version = "1.15.0", features = ["float"] }
rand = "0.10.2"
# random = "0.14.1"

[dev-dependencies]
# Renders the gallery headlessly, so a faceplate can be checked without a window.
iced_test = "0.14"
# Declaring parameters the way an effect does, for the tests that lay one out.
i_am_dsp_derive.workspace = true
