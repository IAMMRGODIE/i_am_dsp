<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Am Patch</title>
<link rel="stylesheet" href="/kit.css">
<link rel="stylesheet" href="/card.css">
</head>
<body>
<header>
  <span class="title">I Am Patch</span>
  <button id="hint-toggle" class="tb hint-toggle" title="What the mouse does" aria-expanded="false" aria-controls="hint">?</button>
  <span id="hint" class="hint">drag a card to move, a port to connect, the corner to scale it; right-click to add a node; Delete removes</span>
  <span class="spacer"></span>
  <button id="zoom-out" class="tb" title="Zoom out">&minus;</button>
  <button id="zoom-in" class="tb" title="Zoom in">+</button>
  <button id="zoom-fit" class="tb" title="Fit the graph">Fit</button>
  <button id="undo" class="tb" title="Undo (Ctrl+Z)" disabled>Undo</button>
  <button id="redo" class="tb" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
  <button id="save" class="tb" title="Save the graph as text, or as one file with everything it plays">Save &#9662;</button>
  <button id="open" class="tb" title="Open a text or a saved bundle">Open</button>
  <input id="file" type="file" accept=".txt,.patch,.iamp" hidden />
</header>
<div id="stage">
  <svg id="graph"></svg>
  <div id="menu"></div>
  <div id="status" class="status" hidden></div>

</div>
<script src="/card.js"></script>
<script src="/kit.js"></script>
</body>
</html>
