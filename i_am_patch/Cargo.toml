[package]
name = "i_am_patch"
version = "0.1.0"
edition = "2024"

# The patch graph's shared building blocks: the crossover, the modulation
# sources and anything else the rack and the patcher both need.
[lib]
crate-type = ["rlib"]

[dependencies]
i_am_dsp = { workspace = true }
i_am_effects = { workspace = true }
i_am_plugin = { workspace = true }
i_am_synths = { workspace = true }
i_am_web_gui = { workspace = true }
# The macro pad is a plain array of atomics; i_am_dsp already builds on the same
# crate, and AtomicF32 keeps a value in one type instead of bit-casting a u32.
portable-atomic = { version = "1.15.0", features = ["float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[lints]
workspace = true